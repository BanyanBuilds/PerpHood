[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "contracts/out"
cache_path = "contracts/cache"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false

[fuzz]
runs = 512

[invariant]
runs = 512
depth = 128
fail_on_revert = false
show_metrics = true
failure_persist_dir = "contracts/cache/invariant-failures"

[profile.assault]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 10_000
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
gas_reports = ["LaunchpadMarketV45", "LaunchpadFactoryV45"]

[profile.assault.fuzz]
runs = 4096
max_test_rejects = 131072

[profile.assault.invariant]
runs = 2048
depth = 256
fail_on_revert = false
show_metrics = true
failure_persist_dir = "contracts/cache/v51-invariant-failures"

